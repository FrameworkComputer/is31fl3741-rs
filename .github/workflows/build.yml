name: build

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rust:
              - '**.rs'
              - 'tests/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/.cargo/**'
              - 'README.md'
              - '.github/workflows/**'
      - if: steps.changes.outputs.rust == 'true'
        run: |
          cargo build --target=thumbv6m-none-eabi --all-features

          pushd examples/adafruit_rgb
          cargo build --target=thumbv6m-none-eabi --examples
          popd

          cargo install flip-link
          pushd examples/ledmatrix
          cargo build --examples
          popd

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rust:
              - '**.rs'
              - 'tests/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '**/.cargo/**'
              - 'README.md'
              - '.github/workflows/**'
      - if: steps.changes.outputs.rust == 'true'
        run: |
          cargo test --all-features
          cargo test --all-features --release
          cargo test --no-default-features
          cargo test --no-default-features --features framework_ledmatrix
          cargo test --no-default-features --features adafruit_rgb_13x9
          cargo test --no-default-features --features adafruit_rgb_13x9,embedded_graphics
          cargo doc --all-features
          cargo clippy --all-features --all-targets -- --deny=warnings
          cargo clippy --no-default-features --all-targets -- --deny=warnings
