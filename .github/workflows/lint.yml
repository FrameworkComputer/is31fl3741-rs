name: lint

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rust:
              - '**.rs'
              - 'rustfmt.toml'
              - '**/Cargo.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
      - if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --check

