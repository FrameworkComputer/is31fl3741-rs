[package]
name = "adafruit_rgb"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
is31fl3741 = { path = "../../", features = [ "adafruit_rgb_13x9", "embedded_graphics" ] }
embedded-hal = "1.0"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
fugit = "0.3.7"
panic-halt = "1.0.0"
rp2040-hal = { version = "0.11.0", features = ["rt", "critical-section-impl"] }
rp2040-boot2 = "0.3"
tinybmp = "0.5.0"
embedded-graphics = "0.8.1"

[[example]]
name = "rgbmatrix"

[[example]]
name = "gaypride"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
